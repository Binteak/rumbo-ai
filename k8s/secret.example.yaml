# Plantilla: NO subas el secreto real al repositorio.
# Créalo con:
#   kubectl -n rumbo create secret generic rumbo-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=GROQ_API_KEY=gsk_... \
#     --from-literal=EXTRA_LLM_API_KEY=hf_... \
#     --from-literal=VOYAGE_API_KEY=pa-... \
#     --from-literal=POSTGRES_PASSWORD=cambia-esto \
#     --from-literal=DATABASE_URL=postgresql+psycopg://rumbo:cambia-esto@postgres:5432/rumbo
# Los proveedores con clave forman una cadena (Claude → Gemini → Groq → extra); sin ninguna, modo demo.
# Sin VOYAGE_API_KEY (vacía) el RAG usa el embedder local; los vectores se guardan igualmente en pgvector.
apiVersion: v1
kind: Secret
metadata:
  name: rumbo-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""
  EXTRA_LLM_API_KEY: ""
  VOYAGE_API_KEY: ""
  POSTGRES_PASSWORD: "cambia-esto"
  DATABASE_URL: "postgresql+psycopg://rumbo:cambia-esto@postgres:5432/rumbo"
