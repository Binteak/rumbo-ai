# Plantilla: NO subas el secreto real al repositorio.
# Créalo con:
#   kubectl -n rumbo create secret generic rumbo-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=POSTGRES_PASSWORD=cambia-esto \
#     --from-literal=DATABASE_URL=postgresql+psycopg://rumbo:cambia-esto@postgres:5432/rumbo
# Sin ANTHROPIC_API_KEY (vacía) el agente funciona en modo demo.
apiVersion: v1
kind: Secret
metadata:
  name: rumbo-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  POSTGRES_PASSWORD: "cambia-esto"
  DATABASE_URL: "postgresql+psycopg://rumbo:cambia-esto@postgres:5432/rumbo"
