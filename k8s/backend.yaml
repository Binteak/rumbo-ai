apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # Varias réplicas: es posible porque las sesiones viven en Redis y los datos en PostgreSQL.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: rumbo-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: rumbo-config }
            - secretRef: { name: rumbo-secrets }
          # Liveness: si el proceso se cuelga, Kubernetes lo reinicia.
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness: no recibe tráfico hasta que PostgreSQL y Redis responden.
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8000
