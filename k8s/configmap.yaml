apiVersion: v1
kind: ConfigMap
metadata:
  name: rumbo-config
data:
  AGENT_MODE: "auto"
  AGENT_MODEL: "claude-sonnet-5-5"
  AGENT_EFFORT: "medium"
  DEMO_DELAY_MS: "600"
  EMBEDDING_MODEL: "voyage-4-lite"
  GEMINI_MODEL: "gemini-flash-latest"
  GROQ_MODEL: "openai/gpt-oss-120b"
  RATE_LIMIT_LLM_PER_HOUR: "5"
  RATE_LIMIT_LLM_PER_DAY: "15"
  LLM_DAILY_TOKEN_BUDGET: "180000"
  RAG_TOP_K: "4"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: "http://rumbo.localhost"
